spring:
  application:
    name: ledger

  datasource:
    # No default here on purpose — the app must fail fast if these aren't
    # set, rather than silently pointing at nothing. Neon connection details
    # arrive as environment variables once actually deployed; local dev
    # points these at a local/dev Postgres instance.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema (see docs/adr/002-data-model-and-consistency.md).
      # Hibernate only ever validates entities match it — it must never be
      # allowed to generate or alter schema itself.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

server:
  port: 8080
